name: racelive

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-formula}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formula}
      POSTGRES_DB: ${POSTGRES_DB:-formula}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только localhost: наружу БД не светим (доступ при нужде — через SSH-туннель).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formula}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    # Только localhost: Redis без пароля не должен торчать в интернет.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  centrifugo:
    image: centrifugo/centrifugo:v5.4.7
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev_centrifugo_api_key}
    volumes:
      - ./infra/centrifugo/config.json:/centrifugo/config.json:ro
    # Только localhost: браузер ходит через Caddy (wss://<домен>/connection/...).
    ports:
      - "127.0.0.1:8001:8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev_centrifugo_api_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Только localhost: браузер данные не тянет напрямую (это делает Next на сервере).
    # /docs доступен через SSH-туннель на 127.0.0.1:8000.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status < 500 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_CENTRIFUGO_URL: ${NEXT_PUBLIC_CENTRIFUGO_URL:-ws://localhost:8001/connection/websocket}
    restart: unless-stopped
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_CENTRIFUGO_URL: ${NEXT_PUBLIC_CENTRIFUGO_URL:-ws://localhost:8001/connection/websocket}
    depends_on:
      - api
      - centrifugo
    # Только localhost: наружу отдаёт Caddy (https://<домен>). Прямой доступ — через туннель.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Reverse-proxy с автоматическим HTTPS (Let's Encrypt). Отдаёт сайт на 443,
  # /connection/* проксирует в Centrifugo (WebSocket) на том же домене → wss://.
  # Работает при SITE_DOMAIN != localhost и открытых портах 80/443.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - centrifugo

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
